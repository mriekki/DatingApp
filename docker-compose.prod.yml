services:
  api:
    image: ghcr.io/mriekki/datingapp-api:latest
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data source=/data/dating.db
      - TokenKey=${TOKEN_KEY}
      - CloudinarySettings__CloudName=${CLOUDINARY_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_API_SECRET}
    volumes:
      - sqlite-data:/data
    networks:
      - datingapp

  client:
    image: ghcr.io/mriekki/datingapp-client:latest
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - datingapp

volumes:
  sqlite-data:

networks:
  datingapp:
